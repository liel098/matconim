<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המתכונים שלי 🌿</title>
    <style>
        :root {
            --primary: #4A3525; /* חום כהה עמוק */
            --accent: #8E7A5F; /* חום-חול חם */
            --natural-green: #5B6D54; /* ירוק-זית עמוק */
            --soft-terracotta: #D37A5A; /* טרקוטה רכה */
            --bg-color: #FAF6F0; /* שמנת/קרם טבעי עדין */
            --card-bg: #FFFFFF;
            --text-main: #332219; /* חום-שחור קריא */
            --text-muted: #736254;
            --border-color: #EFE9DF;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px 12px 40px;
            line-height: 1.5;
        }
        
        .container { max-width: 550px; margin: 0 auto; }
        
        header {
            text-align: center;
            margin: 15px 0 25px;
        }
        
        .logo-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .logo-subtitle {
            font-size: 13px;
            color: var(--accent);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        
        /* אזור הוספת מתכון - משודרג */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(142, 122, 95, 0.08);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 5px; }
        
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            background-color: #FCFAF7;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.25s ease;
        }
        
        input::placeholder, textarea::placeholder { color: #AFA090; }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(142, 122, 95, 0.08);
        }
        
        /* כפתור העלאת קבצים מעוצב */
        .file-upload-wrapper {
            position: relative;
            background: #FCFAF7;
            border: 2px dashed #D6CBB7;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .file-upload-wrapper:active { background: #EFE9DF; }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        .file-upload-text { font-size: 13px; font-weight: 600; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 6px; }

        .btn-submit {
            width: 100%;
            background-color: var(--natural-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 750;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(91, 109, 84, 0.2);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        
        .btn-submit:active { transform: translateY(1px); box-shadow: none; }
        
        /* אזור חיפוש וקטגוריות */
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }
        .search-input {
            padding-right: 35px;
            border-radius: 16px;
            background-color: #FFFFFF;
            box-shadow: 0 5px 15px rgba(142, 122, 95, 0.04);
        }
        .search-icon {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%); color: var(--accent);
            font-size: 16px; pointer-events: none;
        }
        
        /* סינון קטגוריות אופקי (Chips) */
        .category-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 10px;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* מסתיר את הגלילה במכשירים תומכים */
        }
        .category-chips::-webkit-scrollbar { display: none; }
        
        .chip {
            white-space: nowrap;
            background: #F1ECE3;
            color: var(--accent);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .chip.active {
            background-color: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(51, 34, 25, 0.15);
        }
        
        /* רשימת המתכונים */
        .recipe-list { display: flex; flex-direction: column; gap: 20px; }
        
        .recipe-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(142, 122, 95, 0.06);
            border: 1px solid var(--border-color);
            position: relative;
            transition: transform 0.2s;
        }
        
        .recipe-content { padding: 18px; }
        
        .recipe-card h3 {
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 6px 0;
            color: var(--primary);
            line-height: 1.3;
        }
        
        .tag {
            display: inline-block;
            background: #F7F3EB;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 750;
            margin-bottom: 12px;
        }
        
        .recipe-image-container {
            width: 100%;
            max-height: 350px;
            overflow: hidden;
            background: #FAF8F5;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px dashed var(--border-color);
        }
        .recipe-image {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: contain; /* מעולה לצילומי מסך שלא נרצה שיחתכו */
        }
        
        .recipe-text-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #FAF6F0;
        }
        .recipe-text-section strong {
            display: block;
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 4px;
            font-weight: 750;
        }
        .recipe-text-section p {
            margin: 0;
            font-size: 14px;
            color: var(--text-main);
            white-space: pre-line; /* שומר על ירידת שורה */
        }
        
        .card-footer {
            display: flex;
            justify-content: flex-end;
            padding: 12px 18px;
            background-color: #FCFAF7;
            border-top: 1.5px solid var(--border-color);
        }
        
        .delete-btn {
            background-color: transparent;
            color: var(--soft-terracotta);
            border: 1px solid #F6DDD2;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: auto; margin: 0;
        }
        .delete-btn:active { background: #F6DDD2; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--accent);
        }
        .empty-state p { margin: 10px 0 0; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo-title">המתכונים שלי 🌿</h1>
            <div class="logo-subtitle">ספר המתכונים האישי והמהיר שלי</div>
        </header>
        
        <!-- כרטיס הוספה -->
        <div class="card">
            <h2 class="card-title">📖 הוספת מתכון חדש</h2>
            
            <div class="form-group">
                <label>שם המתכון *</label>
                <input type="text" id="recipeName" placeholder="למשל: הפשטידה המנצחת של אמא" required>
            </div>
            
            <div class="form-group">
                <label>קטגוריה</label>
                <select id="recipeCategory">
                    <option value="מנות ראשונות">מנות ראשונות</option>
                    <option value="סלטים">סלטים</option>
                    <option value="בשרי">בשרי</option>
                    <option value="מאפים מלוחים">מאפים מלוחים</option>
                    <option value="מנות לאירוח">מנות לאירוח</option>
                    <option value="מתוקים">מתוקים</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-top:18px;">
                <label>צילום המתכון / תמונה</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="fileText">📷 לחצי להעלאת תמונה או צילום מסך</span>
                    <input type="file" id="recipeImage" accept="image/*" onchange="updateFileStatus()">
                </div>
            </div>
            
            <div class="form-group">
                <label>מצרכים (אופציונלי)</label>
                <textarea id="recipeIngredients" placeholder="כאן כותבים את המצרכים..." rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>אופן ההכנה (אופציונלי)</label>
                <textarea id="recipeInstructions" placeholder="איך מכינים..." rows="3"></textarea>
            </div>
            
            <button class="btn-submit" onclick="addRecipe()">שמירת המתכון אליי ✨</button>
        </div>

        <!-- חיפוש -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="חיפוש מתכון לפי שם..." onkeyup="renderRecipes()">
        </div>

        <!-- קטגוריות אופקיות -->
        <div class="category-chips" id="categoryChips">
            <button class="chip active" onclick="setFilter('הכל')">הכל</button>
            <button class="chip" onclick="setFilter('מנות ראשונות')">מנות ראשונות</button>
            <button class="chip" onclick="setFilter('סלטים')">סלטים</button>
            <button class="chip" onclick="setFilter('בשרי')">בשרי</button>
            <button class="chip" onclick="setFilter('מאפים מלוחים')">מאפים מלוחים</button>
            <button class="chip" onclick="setFilter('מנות לאירוח')">מנות לאירוח</button>
            <button class="chip" onclick="setFilter('מתוקים')">מתוקים</button>
        </div>

        <!-- רשימה -->
        <div class="recipe-list" id="recipesContainer"></div>
    </div>

    <script>
        let recipes = JSON.parse(localStorage.getItem('myMobileRecipes')) || [];
        let currentFilter = 'הכל';

        function updateFileStatus() {
            const fileInput = document.getElementById('recipeImage');
            const fileText = document.getElementById('fileText');
            if (fileInput.files.length > 0) {
                fileText.innerHTML = '✅ התמונה נבחרה בהצלחה!';
                fileText.style.color = '#5B6D54';
            } else {
                fileText.innerHTML = '📷 לחצי להעלאת תמונה או צילום מסך';
                fileText.style.color = 'var(--accent)';
            }
        }

        function setFilter(category) {
            currentFilter = category;
            
            // עדכון חזותי של הכפתורים
            const chips = document.querySelectorAll('.chip');
            chips.forEach(chip => {
                if (chip.textContent.trim() === category) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });
            
            renderRecipes();
        }

        function renderRecipes() {
            const container = document.getElementById('recipesContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';
            
            if (recipes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size:32px;">🍳</span>
                        <p>עדיין אין מתכונים. הוסיפי את הראשון שלך למעלה!</p>
                    </div>`;
                return;
            }

            const filteredRecipes = recipes.filter(recipe => {
                const matchesSearch = recipe.name.toLowerCase().includes(searchTerm);
                const matchesCategory = currentFilter === 'הכל' || recipe.category === currentFilter;
                return matchesSearch && matchesCategory;
            });

            if (filteredRecipes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size:24px;">🤷‍♀️</span>
                        <p>לא נמצאו מתכונים שתואמים לחיפוש שלך.</p>
                    </div>`;
                return;
            }

            filteredRecipes.slice().reverse().forEach(recipe => {
                const originalIndex = recipes.findIndex(r => r.id === recipe.id);
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                let imageHtml = recipe.image ? `
                    <div class="recipe-image-container">
                        <img src="${recipe.image}" class="recipe-image" alt="${recipe.name}">
                    </div>` : '';
                    
                let ingredientsHtml = recipe.ingredients ? `
                    <div class="recipe-text-section">
                        <strong>מצרכים:</strong>
                        <p>\${recipe.ingredients}</p>
                    </div>` : '';
                    
                let instructionsHtml = recipe.instructions ? `
                    <div class="recipe-text-section">
                        <strong>אופן ההכנה:</strong>
                        <p>\${recipe.instructions}</p>
