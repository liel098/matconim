<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המתכונים שלי</title>
    <style>
        :root {
            --primary: #8D6E63; /* חום אדמה */
            --bg-color: #FDFBF7; /* קרם טבעי */
            --card-bg: #FFFFFF;
            --text-main: #4E342E;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: var(--primary); font-weight: 600; }
        .container { max-width: 600px; margin: 0 auto; }
        .recipe-form { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 30px; }
        input, textarea, select { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-family: inherit; font-size: 15px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; padding: 12px; border-radius: 8px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .recipe-list { display: flex; flex-direction: column; gap: 20px; }
        .recipe-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-right: 5px solid var(--primary); }
        .recipe-card h3 { margin: 0 0 10px 0; color: var(--text-main); }
        .category-tag { display: inline-block; background: #EFEBE9; color: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
        .delete-btn { background-color: #EF5350; margin-top: 15px; padding: 8px; font-size: 14px; width: auto; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>המתכונים שלי 🌿</h1>
        
        <div class="recipe-form">
            <h2 style="font-size: 18px; margin-top:0;">הוספת מתכון חדש</h2>
            <input type="text" id="recipeName" placeholder="שם המתכון (למשל: עוגת ביסקוויטים)" required>
            <select id="recipeCategory">
                <option value="ראשונות">מנות ראשונות</option>
                <option value="עיקריות">מנות עיקריות</option>
                <option value="תוספות">תוספות</option>
                <option value="קינוחים">קינוחים</option>
                <option value="מאפים">מאפים</option>
            </select>
            <textarea id="recipeIngredients" placeholder="מצרכים (מומלץ לרדת שורה בין מצרך למצרך)" rows="4" required></textarea>
            <textarea id="recipeInstructions" placeholder="אופן ההכנה..." rows="5" required></textarea>
            <button onclick="addRecipe()">שמירת מתכון</button>
        </div>

        <div class="recipe-list" id="recipesContainer">
            <!-- המתכונים יופיעו כאן -->
        </div>
    </div>

    <script>
        function loadRecipes() {
            const recipes = JSON.parse(localStorage.getItem('myMobileRecipes')) || [];
            const container = document.getElementById('recipesContainer');
            container.innerHTML = '';
            
            if (recipes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #8D6E63;">עדיין אין כאן מתכונים. את מוזמנת להוסיף את המתכון הראשון שלך!</p>';
                return;
            }

            // הצגת המתכונים מהחדש לישן
            recipes.slice().reverse().forEach((recipe, index) => {
                const originalIndex = recipes.length - 1 - index;
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <h3>${recipe.name}</h3>
                    <span class="category-tag">${recipe.category}</span>
                    <p><strong>מצרכים:</strong><br>${recipe.ingredients.replace(/\\n/g, '<br>')}</p>
                    <p><strong>אופן ההכנה:</strong><br>${recipe.instructions.replace(/\\n/g, '<br>')}</p>
                    <button class="delete-btn" onclick="deleteRecipe(${originalIndex})">מחיקת מתכון</button>
                `;
                container.appendChild(card);
            });
        }

        function addRecipe() {
            const name = document.getElementById('recipeName').value;
            const category = document.getElementById('recipeCategory').value;
            const ingredients = document.getElementById('recipeIngredients').value;
            const instructions = document.getElementById('recipeInstructions').value;

            if (!name || !ingredients || !instructions) {
                alert('נא למלא את כל השדות כדי לשמור את המתכון.');
                return;
            }

            const newRecipe = { name, category, ingredients, instructions };
            const recipes = JSON.parse(localStorage.getItem('myMobileRecipes')) || [];
            recipes.push(newRecipe);
            
            localStorage.setItem('myMobileRecipes', JSON.stringify(recipes));
            
            // איפוס השדות אחרי השמירה
            document.getElementById('recipeName').value = '';
            document.getElementById('recipeIngredients').value = '';
            document.getElementById('recipeInstructions').value = '';
            
            loadRecipes();
        }

        function deleteRecipe(index) {
            if (confirm('בטוחה שאת רוצה למחוק את המתכון הזה?')) {
                const recipes = JSON.parse(localStorage.getItem('myMobileRecipes')) || [];
                recipes.splice(index, 1);
                localStorage.setItem('myMobileRecipes', JSON.stringify(recipes));
                loadRecipes();
            }
        }

        // טעינת המתכונים כשהדף עולה
        loadRecipes();
    </script>
</body>
</html>
