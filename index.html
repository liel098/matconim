<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המתכונים שלי 🌿</title>
    <style>
        :root {
            --primary: #4A3525;
            --accent: #8E7A5F;
            --natural-green: #5B6D54;
            --soft-terracotta: #D37A5A;
            --bg-color: #FAF6F0;
            --card-bg: #FFFFFF;
            --text-main: #332219;
            --border-color: #EFE9DF;
            --edit-color: #5C7C8A;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px 12px 40px;
            line-height: 1.5;
        }
        
        .container { max-width: 550px; margin: 0 auto; }
        header { text-align: center; margin: 15px 0 25px; }
        
        .logo-title { font-size: 26px; font-weight: 800; color: var(--primary); margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logo-subtitle { font-size: 13px; color: var(--accent); margin-top: 4px; letter-spacing: 0.5px; }
        
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(142, 122, 95, 0.08); border: 1px solid var(--border-color); margin-bottom: 24px; }
        .card-title { font-size: 18px; font-weight: 700; color: var(--primary); margin: 0 0 15px 0; display: flex; align-items: center; gap: 6px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 5px; }
        
        input, textarea, select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); background-color: #FCFAF7; border-radius: 12px; font-family: inherit; font-size: 14px; color: var(--text-main); transition: all 0.25s ease; }
        input::placeholder, textarea::placeholder { color: #AFA090; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); background-color: #FFFFFF; box-shadow: 0 0 0 3px rgba(142, 122, 95, 0.08); }
        
        .file-upload-wrapper { position: relative; background: #FCFAF7; border: 2px dashed #D6CBB7; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .file-upload-wrapper:active { background: #EFE9DF; }
        .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { font-size: 13px; font-weight: 600; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 6px; }

        .btn-submit { width: 100%; background-color: var(--natural-green); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 750; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(91, 109, 84, 0.2); transition: all 0.2s ease; margin-top: 10px; }
        .btn-submit:active { transform: translateY(1px); box-shadow: none; }
        
        .search-box { position: relative; margin-bottom: 12px; }
        .search-input { padding-right: 35px; border-radius: 16px; background-color: #FFFFFF; box-shadow: 0 5px 15px rgba(142, 122, 95, 0.04); }
        .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 16px; pointer-events: none; }
        
        .category-chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .category-chips::-webkit-scrollbar { display: none; }
        
        .chip { white-space: nowrap; background: #F1ECE3; color: var(--accent); border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.25s ease; }
        .chip.active { background-color: var(--primary); color: #FFFFFF; box-shadow: 0 4px 10px rgba(51, 34, 25, 0.15); }
        
        .recipe-list { display: flex; flex-direction: column; gap: 20px; }
        .recipe-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 24px rgba(142, 122, 95, 0.06); border: 1px solid var(--border-color); position: relative; }
        .recipe-content { padding: 18px; }
        .recipe-card h3 { font-size: 20px; font-weight: 800; margin: 0 0 6px 0; color: var(--primary); line-height: 1.3; }
        
        .tag { display: inline-block; background: #F7F3EB; color: var(--accent); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 750; margin-bottom: 12px; }
        
        /* גלריית תמונות אופקית */
        .recipe-images-gallery { display: flex; gap: 8px; overflow-x: auto; padding: 15px 18px 5px; background: #FAF8F5; border-bottom: 1px dashed var(--border-color); -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .recipe-images-gallery::-webkit-scrollbar { display: none; }
        .gallery-item { height: 220px; width: auto; border-radius: 12px; object-fit: contain; flex-shrink: 0; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #EFE9DF; }
        
        .recipe-text-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid #FAF6F0; }
        .recipe-text-section strong { display: block; font-size: 13px; color: var(--accent); margin-bottom: 4px; font-weight: 750; }
        .recipe-text-section p { margin: 0; font-size: 14px; color: var(--text-main); white-space: pre-line; }
        
        .card-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px; background-color: #FCFAF7; border-top: 1.5px solid var(--border-color); }
        
        .action-btn { background-color: transparent; padding: 6px 14px; font-size: 12px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
        .delete-btn { color: var(--soft-terracotta); border: 1px solid #F6DDD2; }
        .delete-btn:active { background: #F6DDD2; }
        .edit-btn { color: var(--edit-color); border: 1px solid #D1DFE4; }
        .edit-btn:active { background: #D1DFE4; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--accent); }
        .empty-state p { margin: 10px 0 0; font-size: 15px; }

        #cancelEditBtn { background-color: #EFE9DF; color: var(--text-main); margin-top: 10px; display: none; box-shadow: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo-title">המתכונים שלי 🌿</h1>
            <div class="logo-subtitle">ספר המתכונים האישי והמהיר שלי</div>
        </header>
        
        <div class="card" id="formCard">
            <h2 class="card-title" id="formTitle">📖 הוספת מתכון חדש</h2>
            <div class="form-group">
                <label>שם המתכון *</label>
                <input type="text" id="recipeName" placeholder="למשל: הפשטידה המנצחת של אמא" required>
            </div>
            
            <div class="form-group">
                <label>קטגוריה</label>
                <select id="recipeCategory">
                    <option value="מנות ראשונות">מנות ראשונות</option>
                    <option value="סלטים">סלטים</option>
                    <option value="בשרי">בשרי</option>
                    <option value="מאפים מלוחים">מאפים מלוחים</option>
                    <option value="מנות לאירוח">מנות לאירוח</option>
                    <option value="מתוקים">מתוקים</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-top:18px;">
                <label>תמונות (אפשר לבחור כמה)</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="fileText">📷 לחצי לבחירת תמונות</span>
                    <input type="file" id="recipeImage" accept="image/*" multiple onchange="handleImageSelect()">
                </div>
            </div>
            
            <div class="form-group">
                <label>מצרכים (אופציונלי)</label>
                <textarea id="recipeIngredients" placeholder="כאן כותבים את המצרכים..." rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>אופן ההכנה (אופציונלי)</label>
                <textarea id="recipeInstructions" placeholder="איך מכינים..." rows="4"></textarea>
            </div>
            
            <button class="btn-submit" id="submitBtn" onclick="saveRecipe()">שמירת המתכון אליי ✨</button>
            <button class="btn-submit" id="cancelEditBtn" onclick="cancelEdit()">ביטול עריכה</button>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="חיפוש מתכון לפי שם..." onkeyup="renderRecipes()">
        </div>

        <div class="category-chips" id="categoryChips">
            <button class="chip active" onclick="setFilter('הכל')">הכל</button>
            <button class="chip" onclick="setFilter('מנות ראשונות')">מנות ראשונות</button>
            <button class="chip" onclick="setFilter('סלטים')">סלטים</button>
            <button class="chip" onclick="setFilter('בשרי')">בשרי</button>
            <button class="chip" onclick="setFilter('מאפים מלוחים')">מאפים מלוחים</button>
            <button class="chip" onclick="setFilter('מנות לאירוח')">מנות לאירוח</button>
            <button class="chip" onclick="setFilter('מתוקים')">מתוקים</button>
        </div>

        <div class="recipe-list" id="recipesContainer"></div>
    </div>

    <script>
        let recipes = [];
        let editingId = null;
        let currentFilter = 'הכל';

        // טעינת נתונים
        try {
            const savedData = localStorage.getItem('myMobileRecipes');
            if (savedData) {
                recipes = JSON.parse(savedData);
            }
        } catch (e) {
            recipes = [];
        }

        function handleImageSelect() {
            const fileInput = document.getElementById('recipeImage');
            const fileText = document.getElementById('fileText');
            if (fileInput.files.length > 0) {
                fileText.innerHTML = `✅ נבחרו ${fileInput.files.length} תמונות`;
                fileText.style.color = '#5B6D54';
            } else {
                fileText.innerHTML = '📷 לחצי לבחירת תמונות';
                fileText.style.color = 'var(--accent)';
            }
        }

        function setFilter(category) {
            currentFilter = category;
            const chips = document.querySelectorAll('.chip');
            chips.forEach(chip => {
                if (chip.textContent.trim() === category) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });
            renderRecipes();
        }

        function renderRecipes() {
            const container = document.getElementById('recipesContainer');
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            
            container.innerHTML = '';
            
            if (recipes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size:32px;">🍳</span>
                        <p>עדיין אין מתכונים. הוסיפי את הראשון שלך למעלה!</p>
                    </div>`;
                return;
            }

            const filteredRecipes = recipes.filter(recipe => {
                const matchesSearch = recipe.name && recipe.name.toLowerCase().includes(searchTerm);
                const matchesCategory = currentFilter === 'הכל' || recipe.category === currentFilter;
                return matchesSearch && matchesCategory;
            });

            if (filteredRecipes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size:24px;">🤷‍♀️</span>
                        <p>לא נמצאו מתכונים שתואמים לחיפוש שלך.</p>
                    </div>`;
                return;
            }

            filteredRecipes.slice().reverse().forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                // תמיכה במתכונים הישנים (תמונה אחת) ובחדשים (מערך תמונות)
                let imagesList = recipe.images || [];
                if (imagesList.length === 0 && recipe.image) {
                    imagesList = [recipe.image];
                }

                let galleryHtml = '';
                if (imagesList.length > 0) {
                    galleryHtml = `<div class="recipe-images-gallery">`;
                    imagesList.forEach(img => {
                        galleryHtml += `<img src="${img}" class="gallery-item" alt="תמונה">`;
                    });
                    galleryHtml += `</div>`;
                }
                    
                let ingredientsHtml = recipe.ingredients ? `
                    <div class="recipe-text-section">
                        <strong>מצרכים:</strong>
                        <p>${recipe.ingredients}</p>
                    </div>` : '';
                    
                let instructionsHtml = recipe.instructions ? `
                    <div class="recipe-text-section">
                        <strong>אופן ההכנה:</strong>
                        <p>${recipe.instructions}</p>
                    </div>` : '';

                card.innerHTML = `
                    ${galleryHtml}
                    <div class="recipe-content">
                        <span class="tag"># ${recipe.category}</span>
                        <h3>${recipe.name}</h3>
                        ${ingredientsHtml}
                        ${instructionsHtml}
                    </div>
                    <div class="card-footer">
                        <button class="action-btn edit-btn" onclick="editRecipe(${recipe.id})">✏️ עריכה</button>
                        <button class="action-btn delete-btn" onclick="deleteRecipe(${recipe.id})">🗑️ מחיקה</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // כיווץ תמונה עם Promise כדי לתמוך בכמה תמונות במקביל
        function resizeImageAsync(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; // רזולוציה אופטימלית לחיסכון במקום
                        let scaleSize = MAX_WIDTH / img.width;
                        
                        if (img.width > MAX_WIDTH) {
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                        } else {
                            canvas.width = img.width;
                            canvas.height = img.height;
                        }
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5)); // איכות 50% לחיסכון בזיכרון
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            });
        }

        async function saveRecipe() {
            const name = document.getElementById('recipeName').value;
            const category = document.getElementById('recipeCategory').value;
            const ingredients = document.getElementById('recipeIngredients').value;
            const instructions = document.getElementById('recipeInstructions').value;
            const fileInput = document.getElementById('recipeImage');
            
            if (!name) {
                alert('נא להזין את שם המתכון.');
                return;
            }

            document.getElementById('submitBtn').innerText = '⏳ שומר...';
            
            let imagesArray = [];
            
            // אם אנחנו במצב עריכה ולא העלו תמונות חדשות - נשמור את הקיימות
            if (editingId && fileInput.files.length === 0) {
                const existingRecipe = recipes.find(r => r.id === editingId);
                if (existingRecipe) {
                    imagesArray = existingRecipe.images || (existingRecipe.image ? [existingRecipe.image] : []);
                }
            } else {
                // העלאת תמונות חדשות (עד 4 תמונות למתכון כדי לא לחסום את הזיכרון)
                const maxFiles = Math.min(fileInput.files.length, 4);
                if (fileInput.files.length > 4) alert("שימי לב: ניתן לשמור עד 4 תמונות למתכון. רק ה-4 הראשונות יישמרו.");
                
                for (let i = 0; i < maxFiles; i++) {
                    const base64 = await resizeImageAsync(fileInput.files[i]);
                    imagesArray.push(base64);
                }
            }

            const recipeData = { 
                id: editingId ? editingId : Date.now(), 
                name, 
                category, 
                ingredients, 
                instructions,
                images: imagesArray
            };
            
            if (editingId) {
                const index = recipes.findIndex(r => r.id === editingId);
                if(index > -1) recipes[index] = recipeData;
            } else {
                recipes.push(recipeData);
            }
            
            try {
                localStorage.setItem('myMobileRecipes', JSON.stringify(recipes));
                resetForm();
                renderRecipes();
            } catch (e) {
                alert('⚠️ אין מספיק זיכרון בדפדפן! נסי למחוק מתכונים ישנים או להעלות פחות תמונות.');
                document.getElementById('submitBtn').innerText = editingId ? '💾 עדכון המתכון' : 'שמירת המתכון אליי ✨';
            }
        }

        function editRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;
            
            editingId = id;
            document.getElementById('recipeName').value = recipe.name;
            document.getElementById('recipeCategory').value = recipe.category;
            document.getElementById('recipeIngredients').value = recipe.ingredients || '';
            document.getElementById('recipeInstructions').value = recipe.instructions || '';
            
            document.getElementById('formTitle').innerText = '✏️ עריכת מתכון';
            document.getElementById('submitBtn').innerText = '💾 שמירת העדכון';
            document.getElementById('cancelEditBtn').style.display = 'block';
            
            document.getElementById('fileText').innerHTML = '📷 לבחירת תמונות חדשות (יחליפו את הקיימות)';
            document.getElementById('recipeImage').value = ''; // איפוס בחירת הקבצים
            
            // גלילה חלקה לטופס
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            resetForm();
        }

        function resetForm() {
            editingId = null;
            document.getElementById('recipeName').value = '';
            document.getElementById('recipeIngredients').value = '';
            document.getElementById('recipeInstructions').value = '';
            document.getElementById('recipeImage').value = '';
            
            document.getElementById('formTitle').innerText = '📖 הוספת מתכון חדש';
            document.getElementById('submitBtn').innerText = 'שמירת המתכון אליי ✨';
            document.getElementById('cancelEditBtn').style.display = 'none';
            handleImageSelect();
        }

        function deleteRecipe(id) {
            if (confirm('למחוק את המתכון הזה? 🗑️')) {
                recipes = recipes.filter(r => r.id !== id);
                localStorage.setItem('myMobileRecipes', JSON.stringify(recipes));
                renderRecipes();
            }
        }

        window.onload = function() {
            renderRecipes();
        };
    </script>
</body>
</html>
